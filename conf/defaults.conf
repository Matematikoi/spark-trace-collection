# Shared Spark properties for trace collection and LqpServer.
# Pass with: spark-submit --properties-file conf/defaults.conf
# Every key dumped into "Configuration" (F.runtimeKnobsDict) is pinned here so
# both sides report the same values; mostly Spark 3.5 defaults.

# theta_c: context parameters
spark.executor.cores                                          4
spark.executor.memory                                         4g
spark.executor.instances                                      2
spark.default.parallelism                                     40
spark.reducer.maxSizeInFlight                                 48m
spark.shuffle.sort.bypassMergeThreshold                       200
spark.shuffle.compress                                        true
spark.memory.fraction                                         0.6

# theta_p: logical query plan parameters
spark.sql.adaptive.advisoryPartitionSizeInBytes               64MB
spark.sql.adaptive.nonEmptyPartitionRatioForBroadcastJoin     0.2
spark.sql.adaptive.maxShuffledHashJoinLocalMapThreshold       0b
spark.sql.adaptive.autoBroadcastJoinThreshold                 10MB
spark.sql.shuffle.partitions                                  200
spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes   256MB
spark.sql.adaptive.skewJoin.skewedPartitionFactor             5
spark.sql.files.maxPartitionBytes                             128MB
spark.sql.files.openCostInBytes                               4MB

# theta_s: query stage parameters
spark.sql.adaptive.rebalancePartitionsSmallPartitionFactor    0.2
spark.sql.adaptive.coalescePartitions.minPartitionSize        1MB

# not dumped, but shape the optimized plan
spark.sql.adaptive.enabled                                    true
spark.sql.cbo.enabled                                         true

spark.serializer                                              org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max                               512m
spark.ui.showConsoleProgress                                  false

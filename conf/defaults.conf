# Shared Spark properties for trace collection and LqpServer.
# Pass with: spark-submit --properties-file conf/defaults.conf
# Every key dumped into "Configuration" (F.runtimeKnobsDict) is pinned here so
# both sides report the same values. Values are the per-app average over the
# 10,992 Spark traces in 2026_04_09_openai_flex/spark/openai_flex_11k.parquet
# (integers rounded, sizes in the traces' units, shuffle.compress = majority).

# theta_c: context parameters
spark.executor.cores                                          3
spark.executor.memory                                         5g
spark.executor.instances                                      10
spark.default.parallelism                                     48
spark.reducer.maxSizeInFlight                                 17m
spark.shuffle.sort.bypassMergeThreshold                       200
spark.shuffle.compress                                        false
spark.memory.fraction                                         0.63

# theta_p: logical query plan parameters
spark.sql.adaptive.advisoryPartitionSizeInBytes               23MB
spark.sql.adaptive.nonEmptyPartitionRatioForBroadcastJoin     0.35
spark.sql.adaptive.maxShuffledHashJoinLocalMapThreshold       159MB
spark.sql.adaptive.autoBroadcastJoinThreshold                 157MB
spark.sql.shuffle.partitions                                  208
spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes   92MB
spark.sql.adaptive.skewJoin.skewedPartitionFactor             5.01
spark.sql.files.maxPartitionBytes                             46MB
spark.sql.files.openCostInBytes                               1MB

# theta_s: query stage parameters
spark.sql.adaptive.rebalancePartitionsSmallPartitionFactor    0.2
spark.sql.adaptive.coalescePartitions.minPartitionSize        1793KB

# not dumped, but shape the optimized plan
spark.sql.adaptive.enabled                                    true
spark.sql.cbo.enabled                                         true

spark.serializer                                              org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max                               512m
spark.ui.showConsoleProgress                                  false
